name: TTE BTM Poređenje

on:
  workflow_dispatch:
  push:
    paths:
      - BTM_export.xls
  schedule:
    - cron: "0 6 * * *"

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl xlrd

      - name: Check BTM file
        run: |
          echo "Sadržaj repository-ja:"
          ls -lah
          echo ""
          echo "Provera BTM fajla:"
          if [ ! -f "BTM_export.xls" ]; then
            echo "GREŠKA: BTM_export.xls ne postoji!"
            exit 1
          fi
          echo "BTM_export.xls pronađen."
          ls -lh BTM_export.xls

      - name: Run price comparison
        env:
          TTE_ETAIL_API_KEY: ${{ secrets.TTE_ETAIL_API_KEY }}
          TTE_HAVIT_API_KEY: ${{ secrets.TTE_HAVIT_API_KEY }}
        run: |
          python price_compare.py

      - name: Check result
        run: |
          if [ ! -f "BTM_TTE_poredjenje.xlsx" ]; then
            echo "GREŠKA: Excel rezultat nije napravljen!"
            exit 1
          fi
          ls -lh BTM_TTE_poredjenje.xlsx

      - name: Upload comparison Excel
        uses: actions/upload-artifact@v4
        with:
          name: BTM-TTE-poredjenje
          path: BTM_TTE_poredjenje.xlsx
          retention-days: 30
