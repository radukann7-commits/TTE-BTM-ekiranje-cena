name: TTE BTM Poređenje

on:
  workflow_dispatch:
  push:
    paths:
      - BTM_export.xls
  schedule:
    - cron: "0 6 * * *"

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl xlrd xlwt

      - name: Check and prepare BTM file
        run: |
          echo "Sadržaj repository-ja:"
          ls -lah

          if [ ! -f "BTM_export.xls" ]; then
            echo "GREŠKA: BTM_export.xls ne postoji!"
            exit 1
          fi

          echo "BTM fajl pronađen:"
          ls -lh BTM_export.xls

          python - <<'PY'
          import os
          import zipfile
          from openpyxl import load_workbook
          import xlwt

          filename = "BTM_export.xls"

          # BTM portal može da pošalje pravi XLSX fajl sa .xls ekstenzijom.
          # XLSX je ZIP format i počinje sa PK. U tom slučaju napravimo
          # privremeni pravi XLS fajl koji postojeći price_compare.py može da pročita.
          if zipfile.is_zipfile(filename):
              print("BTM fajl je XLSX sadržaj sa .xls ekstenzijom.")
              print("Konvertujem ga u pravi XLS za poređenje...")

              wb_in = load_workbook(filename, data_only=True, read_only=True)
              ws_in = wb_in.active

              wb_out = xlwt.Workbook()
              ws_out = wb_out.add_sheet("BTM")

              for row_idx, row in enumerate(ws_in.iter_rows(), start=0):
                  for col_idx, cell in enumerate(row, start=0):
                      value = cell.value
                      if value is not None:
                          ws_out.write(row_idx, col_idx, value)

              wb_out.save(filename)
              wb_in.close()

              print("Konverzija završena.")
          else:
              print("BTM fajl je pravi XLS. Nije potrebna konverzija.")
          PY

          file BTM_export.xls
          ls -lh BTM_export.xls

      - name: Run price comparison
        env:
          TTE_ETAIL_API_KEY: ${{ secrets.TTE_ETAIL_API_KEY }}
          TTE_HAVIT_API_KEY: ${{ secrets.TTE_HAVIT_API_KEY }}
        run: |
          python price_compare.py

      - name: Check result
        run: |
          if [ ! -f "BTM_TTE_poredjenje.xlsx" ]; then
            echo "GREŠKA: Excel rezultat nije napravljen!"
            exit 1
          fi
          ls -lh BTM_TTE_poredjenje.xlsx

      - name: Upload comparison Excel
        uses: actions/upload-artifact@v4
        with:
          name: BTM-TTE-poredjenje
          path: BTM_TTE_poredjenje.xlsx
          retention-days: 30
