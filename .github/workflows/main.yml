name: TTE BTM Poređenje

on:
  workflow_dispatch:
  push:
    paths:
      - BTM_export.xls
      - price_compare.py
  schedule:
    - cron: "0 6 * * *"

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl xlrd xlwt

      - name: Check and prepare BTM file
        run: |
          echo "Sadržaj repository-ja:"
          ls -lah

          if [ ! -f "BTM_export.xls" ]; then
            echo "GREŠKA: BTM_export.xls ne postoji!"
            exit 1
          fi

          echo "BTM fajl pronađen:"
          ls -lh BTM_export.xls

          python - <<'PY'
          import csv
          import io
          import zipfile
          import xlwt
          from openpyxl import load_workbook

          filename = "BTM_export.xls"
          data = open(filename, "rb").read()

          # 1. Ako je zapravo XLSX, pretvori ga u pravi XLS.
          if zipfile.is_zipfile(io.BytesIO(data)):
              print("BTM fajl je XLSX sadržaj sa .xls ekstenzijom.")
              wb_in = load_workbook(filename, data_only=True, read_only=True)
              ws_in = wb_in.active

              wb_out = xlwt.Workbook()
              ws_out = wb_out.add_sheet("BTM")

              for row_idx, row in enumerate(ws_in.iter_rows(), start=0):
                  for col_idx, cell in enumerate(row, start=0):
                      if cell.value is not None:
                          ws_out.write(row_idx, col_idx, cell.value)

              wb_out.save(filename)
              wb_in.close()
              print("XLSX -> XLS konverzija završena.")

          # 2. BTM portal trenutno daje UTF-8 TSV/tekst fajl sa .xls ekstenzijom.
          #    Prepoznajemo ga po UTF-8 BOM-u i tabovima i pretvaramo u pravi XLS.
          elif data.startswith(b"\xef\xbb\xbf") or b"\t" in data[:5000]:
              print("BTM fajl je tekstualni TSV export sa .xls ekstenzijom.")
              text = data.decode("utf-8-sig", errors="replace")
              rows = csv.reader(io.StringIO(text), delimiter="\t")

              wb_out = xlwt.Workbook()
              ws_out = wb_out.add_sheet("BTM")

              for row_idx, row in enumerate(rows, start=0):
                  for col_idx, value in enumerate(row, start=0):
                      ws_out.write(row_idx, col_idx, value)

              wb_out.save(filename)
              print("TSV -> XLS konverzija završena.")

          # 3. Ako je pravi XLS, ostavljamo ga bez izmene.
          else:
              print("BTM fajl izgleda kao pravi XLS. Nije potrebna konverzija.")
          PY

          file BTM_export.xls
          ls -lh BTM_export.xls

      - name: Run price comparison
        env:
          TTE_ETAIL_API_KEY: ${{ secrets.TTE_ETAIL_API_KEY }}
          TTE_HAVIT_API_KEY: ${{ secrets.TTE_HAVIT_API_KEY }}
        run: |
          python price_compare.py

      - name: Check result
        run: |
          if [ ! -f "BTM_TTE_poredjenje.xlsx" ]; then
            echo "GREŠKA: Excel rezultat nije napravljen!"
            exit 1
          fi
          ls -lh BTM_TTE_poredjenje.xlsx

      - name: Upload comparison Excel
        uses: actions/upload-artifact@v4
        with:
          name: BTM-TTE-poredjenje
          path: BTM_TTE_poredjenje.xlsx
          retention-days: 30
